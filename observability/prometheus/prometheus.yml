global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'restaurant-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['restaurant-service:8080']

  # Every kitchen-service instance is discovered through Consul, so each kitchen is scraped
  # on its own (load, burners, Kafka lag per instance) — including kitchens spawned at runtime.
  - job_name: 'kitchen-service'
    metrics_path: '/actuator/prometheus'
    consul_sd_configs:
      - server: 'consul:8500'
        services: ['kitchen-service']
    relabel_configs:
      # Skip stopped kitchens Consul has not deregistered yet
      - source_labels: [__meta_consul_health]
        regex: passing
        action: keep
      # instance label = Consul service id (kitchen-service-<uuid>), same id as the floor view
      - source_labels: [__meta_consul_service_id]
        target_label: instance
